# =============================================================================
# euvsimulator — Docker Compose (API service)
# =============================================================================
# Starts the euvsimulator REST API on port 8000, with CXRO data mounted from the
# host source tree so the database is live without rebuilding the image.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: euvsimulator-api
    ports:
      - "8000:8000"
    volumes:
      - ./src/euvsimulator/data:/app/euvsimulator/data
    restart: unless-stopped